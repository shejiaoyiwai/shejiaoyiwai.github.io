        let currentCategory = null;

        function initTags() {
            const tagsContainer = document.getElementById("tagsContainer");
            const categories = [...new Set(jokesData.map(joke => joke.category))];
            
            categories.forEach(category => {
                const btn = document.createElement("button");
                btn.className = "tag-btn";
                btn.textContent = category;
                btn.addEventListener("click", () => selectCategory(category, btn));
                tagsContainer.appendChild(btn);
            });
        }

        function selectCategory(category, btn) {
            currentCategory = category;
            
            document.querySelectorAll(".tag-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            
            document.getElementById("refreshBtn").style.display = "block";
            
            showRandomJoke();
        }

        function showRandomJoke() {
            if (!currentCategory || !jokesData) return;
            
            const filteredJokes = jokesData.filter(joke => joke.category === currentCategory);
            if (filteredJokes.length === 0) return;
            
            const randomIndex = Math.floor(Math.random() * filteredJokes.length);
            const joke = filteredJokes[randomIndex];
            
            displayJoke(joke);
        }

        function displayJoke(joke) {
            const display = document.getElementById("jokeDisplay");
            
            display.style.animation = "none";
            display.offsetHeight;
            display.style.animation = "fadeInUp 0.8s ease-out forwards";
            
            const dateStr = joke.date || "日期未知";
            display.innerHTML = "<p class=\"joke-text\">" + joke.text + "</p>" +
                             "<p class=\"joke-meta\">" + dateStr + " · " + joke.category + "</p>";
        }

        document.getElementById("refreshBtn").addEventListener("click", showRandomJoke);

        initTags();
    </script>
